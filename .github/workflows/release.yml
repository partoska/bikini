name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify tag matches project version
        id: version
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          CMAKE_VERSION=$(sed -n 's/^project(bikini VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          HEADER_VERSION=$(sed -n 's/^#define BK_VERSION "\([0-9.]*\)"/\1/p' src/lib/inc/bikini.h)
          MAKE_VERSION=$(sed -n 's/^VERSION = \([0-9.]*\)$/\1/p' Makefile)
          echo "tag=${VERSION} cmake=${CMAKE_VERSION} header=${HEADER_VERSION} make=${MAKE_VERSION}"
          if [ "$VERSION" != "$CMAKE_VERSION" ] || [ "$VERSION" != "$HEADER_VERSION" ] || [ "$VERSION" != "$MAKE_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match CMakeLists.txt (${CMAKE_VERSION}) / bikini.h (${HEADER_VERSION}) / Makefile (${MAKE_VERSION})"
            exit 1
          fi
          node .github/scripts/npm-version.js verify "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
  build-linux-amd64:
    needs: [check-version]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake rpm
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        run: cmake --build build --parallel 1
      - name: Package
        run: cpack --config build/CPackConfig.cmake
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_linux_amd64
          path: build/src/cli/bikini
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages_linux_amd64
          path: dist/
  build-linux-arm64:
    needs: [check-version]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake rpm
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        run: cmake --build build --parallel 1
      - name: Package
        run: cpack --config build/CPackConfig.cmake
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_linux_arm64
          path: build/src/cli/bikini
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages_linux_arm64
          path: dist/
  build-linux-armhf:
    needs: [check-version]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Register QEMU handlers
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Build in Raspberry Pi OS (ARMv6)
        run: |
          docker run --rm --platform linux/arm/v6 \
            -v "$PWD":/src -w /src \
            --entrypoint /bin/bash \
            balenalib/rpi-raspbian:bookworm -eu -o pipefail -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                build-essential cmake
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON
              cmake --build build --parallel "$(nproc)"
              cpack --config build/CPackConfig.cmake -G "DEB;TGZ"
              chown -R '"$(id -u):$(id -g)"' build dist
            '
      - name: Verify ARMv6 output
        run: |
          readelf -A build/src/cli/bikini | grep -E "Tag_CPU_arch:|Tag_FP_arch:"
          readelf -A build/src/cli/bikini | grep -q "Tag_CPU_arch: v6" || {
            echo "::error::binary is not ARMv6, it will not run on a Pi Zero / Zero W"
            exit 1
          }
          docker run --rm --platform linux/arm/v6 \
            -v "$PWD":/src -w /src \
            --entrypoint /src/build/src/cli/bikini \
            balenalib/rpi-raspbian:bookworm --version
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_linux_armhf
          path: build/src/cli/bikini
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages_linux_armhf
          path: dist/
  build-macos:
    needs: [check-version]
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --parallel 1
      - name: Package
        run: cpack --config build/CPackConfig.cmake
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_darwin_universal
          path: build/src/cli/bikini
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages_darwin_universal
          path: dist/
  build-windows-amd64:
    needs: [check-version]
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          cache: false
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 1
      - name: Package (ZIP, NSIS, WiX)
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath "$WIX")/bin:$PATH"
          cpack --config build/CPackConfig.cmake -G "ZIP;NSIS;WIX"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_windows_amd64
          path: build/bin/bikini.exe
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages_windows_amd64
          path: dist/
  build-windows-arm64:
    needs: [check-version]
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          cache: false
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 1
      - name: Package (ZIP, NSIS)
        shell: msys2 {0}
        run: cpack --config build/CPackConfig.cmake -G "ZIP;NSIS"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_windows_arm64
          path: build/bin/bikini.exe
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages_windows_arm64
          path: dist/
  package-skill:
    needs: [check-version]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Package skill
        run: |
          set -euo pipefail
          if ! grep -qx 'name: bikini' skills/bikini/SKILL.md; then
            echo "::error::skills/bikini/SKILL.md does not declare the bikini skill"
            exit 1
          fi
          # The archive holds the skill folder itself (bikini/SKILL.md, ...),
          # the layout agent tools expect when installing a skill from a zip.
          mkdir -p dist
          ( cd skills && zip -r -X "../dist/bikini_${VERSION}_skill.zip" bikini -x '*/.*' )
          unzip -l "dist/bikini_${VERSION}_skill.zip"
      # Not named bikini_*, so the npm, Homebrew and Scoop jobs do not
      # download it.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skill_bikini
          path: dist/bikini_${{ env.VERSION }}_skill.zip
  release:
    needs:
      [
        check-version,
        build-linux-amd64,
        build-linux-arm64,
        build-linux-armhf,
        build-macos,
        build-windows-amd64,
        build-windows-arm64,
        package-skill,
      ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/bikini_linux_amd64/bikini release/bikini_${VERSION}_linux_amd64
          cp artifacts/bikini_linux_arm64/bikini release/bikini_${VERSION}_linux_arm64
          cp artifacts/bikini_linux_armhf/bikini release/bikini_${VERSION}_linux_armhf
          cp artifacts/bikini_darwin_universal/bikini release/bikini_${VERSION}_darwin_universal
          cp artifacts/bikini_windows_amd64/bikini.exe release/bikini_${VERSION}_windows_amd64.exe
          cp artifacts/bikini_windows_arm64/bikini.exe release/bikini_${VERSION}_windows_arm64.exe
          cp artifacts/packages_*/* release/
          cp artifacts/skill_bikini/bikini_${VERSION}_skill.zip release/
          ( cd release && sha256sum * > SHA256SUMS )
          cat release/SHA256SUMS
      - name: Create release
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
  npm-publish:
    needs: [check-version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bikini_*
          path: artifacts/
      - name: Stamp and verify package versions
        run: |
          node .github/scripts/npm-version.js stamp "$VERSION"
          node .github/scripts/npm-version.js verify "$VERSION"
      - name: Stage native binaries into platform packages
        run: |
          set -euo pipefail
          declare -A SRC=(
            [npm/bikini-darwin/bin/bikini]=artifacts/bikini_darwin_universal/bikini
            [npm/bikini-linux-x64/bin/bikini]=artifacts/bikini_linux_amd64/bikini
            [npm/bikini-linux-arm64/bin/bikini]=artifacts/bikini_linux_arm64/bikini
            [npm/bikini-win32-x64/bin/bikini.exe]=artifacts/bikini_windows_amd64/bikini.exe
            [npm/bikini-win32-arm64/bin/bikini.exe]=artifacts/bikini_windows_arm64/bikini.exe
          )
          for dest in "${!SRC[@]}"; do
            src="${SRC[$dest]}"
            if [ ! -f "$src" ]; then
              echo "::error::missing expected binary artifact: $src"
              exit 1
            fi
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
            chmod +x "$dest"
          done
      - name: Publish packages
        run: |
          set -euo pipefail
          # Platform packages first, so the main package's optionalDependencies
          # resolve as soon as it is published. Already-published versions are
          # skipped, which makes re-running this job safe.
          for d in npm/bikini-darwin npm/bikini-linux-x64 npm/bikini-linux-arm64 \
                   npm/bikini-win32-x64 npm/bikini-win32-arm64 npm/bikini; do
            name=$(node -p "require('./$d/package.json').name")
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} already published, skipping"
              continue
            fi
            ( cd "$d" && npm publish --provenance --access public )
          done
  homebrew-update:
    needs: [check-version, release]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: partoska/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bikini_*
          path: artifacts/
      - name: Update formula
        run: |
          set -euo pipefail
          SHA256_DARWIN=$(sha256sum artifacts/bikini_darwin_universal/bikini | cut -d' ' -f1)
          SHA256_LINUX_AMD64=$(sha256sum artifacts/bikini_linux_amd64/bikini | cut -d' ' -f1)
          SHA256_LINUX_ARM64=$(sha256sum artifacts/bikini_linux_arm64/bikini | cut -d' ' -f1)
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/bikini.rb
          sed -i "/url .*darwin_universal/{n; s/sha256 \".*\"/sha256 \"${SHA256_DARWIN}\"/}" Formula/bikini.rb
          sed -i "/url .*linux_amd64/{n; s/sha256 \".*\"/sha256 \"${SHA256_LINUX_AMD64}\"/}" Formula/bikini.rb
          sed -i "/url .*linux_arm64/{n; s/sha256 \".*\"/sha256 \"${SHA256_LINUX_ARM64}\"/}" Formula/bikini.rb
          # Fail loudly if the formula layout drifted and a substitution missed.
          for expected in "version \"${VERSION}\"" "sha256 \"${SHA256_DARWIN}\"" \
                          "sha256 \"${SHA256_LINUX_AMD64}\"" "sha256 \"${SHA256_LINUX_ARM64}\""; do
            if ! grep -qF "$expected" Formula/bikini.rb; then
              echo "::error::Formula/bikini.rb was not updated: missing ${expected}"
              exit 1
            fi
          done
          cat Formula/bikini.rb
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "bikini-ops"
          git config user.email "bikini-ops@users.noreply.github.com"
          git add Formula/bikini.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "Update bikini to ${GITHUB_REF_NAME}"
          git push
  scoop-update:
    needs: [check-version, release]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout scoop-bucket
        uses: actions/checkout@v7
        with:
          repository: partoska/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bikini_windows_*
          path: artifacts/
      - name: Update manifest
        run: |
          set -euo pipefail
          SHA256_AMD64=$(sha256sum artifacts/bikini_windows_amd64/bikini.exe | cut -d' ' -f1)
          SHA256_ARM64=$(sha256sum artifacts/bikini_windows_arm64/bikini.exe | cut -d' ' -f1)
          node -e '
            const fs = require("fs");
            const [version, sha256Amd64, sha256Arm64] = process.argv.slice(1);
            const base = `https://github.com/partoska/bikini/releases/download/v${version}`;
            const file = "bucket/bikini.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = version;
            manifest.architecture["64bit"].url = `${base}/bikini_${version}_windows_amd64.exe#/bikini.exe`;
            manifest.architecture["64bit"].hash = sha256Amd64;
            manifest.architecture["arm64"].url = `${base}/bikini_${version}_windows_arm64.exe#/bikini.exe`;
            manifest.architecture["arm64"].hash = sha256Arm64;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          ' "$VERSION" "$SHA256_AMD64" "$SHA256_ARM64"
          cat bucket/bikini.json
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "bikini-ops"
          git config user.email "bikini-ops@users.noreply.github.com"
          git add bucket/bikini.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date"
            exit 0
          fi
          git commit -m "Update bikini to ${GITHUB_REF_NAME}"
          git push
