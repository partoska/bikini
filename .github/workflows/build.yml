name: Build
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_SANITIZERS=ON -DWITH_VERBOSE_DEBUG=ON -DWITH_TESTS=ON -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        run: cmake --build build --parallel 1
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_linux_amd64
          path: build/src/cli/bikini
  build-make:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and test with make
        run: make test
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_SANITIZERS=ON -DWITH_VERBOSE_DEBUG=ON -DWITH_TESTS=ON -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        run: cmake --build build --parallel 1
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_linux_arm64
          path: build/src/cli/bikini
  build-linux-shared:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DWITH_TESTS=ON -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        run: cmake --build build --parallel 1
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Install and link with pkg-config
        run: |
          set -euo pipefail
          cmake --install build --prefix "$PWD/prefix"
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$PWD/prefix/lib"
          printf '#include <bikini.h>\nint main (void) { BKIni *ini = bkInit (BK_FNONE); bkDestroy (ini); return ini == 0; }\n' > consumer.c
          cc -std=c99 consumer.c $(pkg-config --cflags --libs bikini) -o consumer
          ./consumer
  build-linux-armhf:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Register QEMU handlers
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Build and test in Raspberry Pi OS (ARMv6)
        run: |
          docker run --rm --platform linux/arm/v6 \
            -v "$PWD":/src -w /src \
            --entrypoint /bin/bash \
            balenalib/rpi-raspbian:bookworm -eu -o pipefail -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                build-essential cmake
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=ON -DWITH_TESTS=ON -DCMAKE_VERBOSE_MAKEFILE=ON
              cmake --build build --parallel "$(nproc)"
              ctest --test-dir build --output-on-failure
              chown -R '"$(id -u):$(id -g)"' build
            '
      - name: Verify ARMv6 output
        run: |
          readelf -A build/src/cli/bikini | grep -E "Tag_CPU_arch:|Tag_FP_arch:"
          readelf -A build/src/cli/bikini | grep -q "Tag_CPU_arch: v6" || {
            echo "::error::binary is not ARMv6, it will not run on a Pi Zero / Zero W"
            exit 1
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_linux_armhf
          path: build/src/cli/bikini
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_SANITIZERS=ON -DWITH_VERBOSE_DEBUG=ON -DWITH_TESTS=ON -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --parallel 1
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_darwin_universal
          path: build/src/cli/bikini
  build-windows-amd64:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          cache: false
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=ON -DWITH_TESTS=ON -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 1
      - name: Run tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      # Catches installer problems before a release tag does.
      - name: Package (ZIP, NSIS, WiX)
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath "$WIX")/bin:$PATH"
          cpack --config build/CPackConfig.cmake -G "ZIP;NSIS;WIX"
          ls -l dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_windows_amd64
          path: build/bin/bikini.exe
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          cache: false
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=ON -DWITH_TESTS=ON -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 1
      - name: Run tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bikini_windows_arm64
          path: build/bin/bikini.exe
  build-windows-msvc:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -A x64 -DWITH_TESTS=ON
      - name: Build (static)
        shell: bash
        run: cmake --build build --config Debug --parallel 1
      - name: Run tests (static)
        shell: bash
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Build and test (shared)
        shell: bash
        run: |
          cmake -S . -B build-shared -A x64 -DWITH_TESTS=ON -DBUILD_SHARED_LIBS=ON
          cmake --build build-shared --config Release --parallel 1
          ctest --test-dir build-shared -C Release --output-on-failure
  build-npm:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check npm launcher
        run: node --check npm/bikini/bin/bikini.js
      - name: Verify versions
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^project(bikini VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          HEADER_VERSION=$(sed -n 's/^#define BK_VERSION "\([0-9.]*\)"/\1/p' src/lib/inc/bikini.h)
          if [ "$VERSION" != "$HEADER_VERSION" ]; then
            echo "::error::CMakeLists.txt (${VERSION}) and bikini.h (${HEADER_VERSION}) disagree"
            exit 1
          fi
          node .github/scripts/npm-version.js verify "$VERSION"
      - name: Dry-run pack all npm packages
        run: |
          set -euo pipefail
          for d in npm/*/; do
            ( cd "$d" && npm pack --dry-run )
          done
